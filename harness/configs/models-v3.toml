# Higher-tier arms for PREREG_ADDENDUM_D.md (D3), alongside configs/models-v2.toml. Same request settings
# as the budget arms: at most 1,024 output tokens, model-side reasoning off, default sampling.
# Claude goes through Anthropic's API (kind "anthropic", cost computed at list prices by extension/priced.py);
# Sonnet 5.5 rejects thinking "disabled", and "between_tools" is its documented way to turn thinking off.

[[backends]]
name = "sonnet-5.5"
kind = "anthropic"
model = "claude-sonnet-5-5"
params = { max_tokens = 1024, thinking = "between_tools" }
price_in_per_mtok = 2.00
price_out_per_mtok = 10.00
measured_usd_per_1k_calls = 0.66  # estimate: Haiku's v1 tokens at these prices; replaced by the probe and pilot

[[backends]]
name = "gpt-5.6-terra"
kind = "openrouter"
model = "openai/gpt-5.6-terra"
params = { upstream = "openai", reasoning_effort = "none", max_tokens = 1024 }
price_in_per_mtok = 2.00
price_out_per_mtok = 12.00
measured_usd_per_1k_calls = 0.49  # estimate: GPT-5.6 Luna's v1 tokens at these prices
