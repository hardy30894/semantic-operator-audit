# study-abt-A: confirmatory run (PREREGISTRATION.md §4.3). Do not edit after timestamping.
#   python3 -m semaudit run configs/study-abt-A.toml --run-id study-abt-A --backend <arm> --yes
include = ["models.toml"]

[run]
seed = 1018003
repeats = 5
concurrency = 16
output_dir = "runs"
prompt_style = "lotus"

[data]
kind = "dir"
path = "../data/abt-A"

[identities.placement]
enabled = true
n_tuples = 200

[identities.filter_algebra]
enabled = true
n_rows = 300
count_batch = 10

[identities.batch]
enabled = true
n_rows = 300
batch_size = 10

[identities.idempotence]
enabled = true
n_rows = 200
