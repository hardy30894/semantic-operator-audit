# Addendum H: rewording placebos on arxiv-B, with Addendum G's design minus its unknown segment and its
# temperature-0 arm (PREREG_ADDENDUM_H.md). Same seed and data as study-arxiv-B, so the 200 rows are the first 200 of
# study-arxiv-B's rows. Segments, interleaved in one seeded order (extension/placebo_segments.py):
#   base     semaudit's p, not_p, q, p_and_q and q_and_p requests (no COUNT: base_count = false)
#   reword   p in two paraphrases, in the plain template and with the record's fields reversed; p and q in a paraphrase
# Arms: haiku-5.5, gpt-5.6-luna and gemini-3.5-flash-lite, one process each.
#   python3 -m extension run configs/ext-placebo-arxiv-B.toml --run-id ext-placebo-arxiv-B --backend haiku-5.5 --calibration configs/ext-calibration-v3.json --max-cost-factor 2 --yes
#   python3 -m extension run configs/ext-placebo-arxiv-B.toml --run-id ext-placebo-arxiv-B --backend gpt-5.6-luna --calibration configs/ext-calibration-v3.json --max-cost-factor 2 --yes
#   python3 -m extension run configs/ext-placebo-arxiv-B.toml --run-id ext-placebo-arxiv-B --backend gemini-3.5-flash-lite --calibration configs/ext-calibration-v3.json --max-cost-factor 2 --yes
#   python3 -m extension placebo runs/ext-placebo-arxiv-B --n-perm 10000 --n-boot 10000
include = ["models-v2.toml"]

[run]
seed = 1021302
repeats = 5
concurrency = 16
output_dir = "runs"
prompt_style = "lotus"

[data]
kind = "dir"
path = "../data/arxiv-B"

[identities.filter_algebra]
enabled = true
n_rows = 200

[ext]
include_base = true
base_count = false
mitigations = []
segments = ["reword"]

[ext.reword]
p = ["The paper's primary field is physics or astronomy (such as astrophysics, materials science, quantum physics or atmospheric physics).", "Physics or astronomy (for instance astrophysics, materials science, quantum physics or atmospheric physics) is the main field of the paper."]
pq = "The paper's primary field is physics or astronomy (such as astrophysics, materials science, quantum physics or atmospheric physics), and the paper is chiefly theoretical (its results are proved or derived mathematically, not obtained from experiments, observations, simulations or data)."
template_style = "plain"
field_order = "reversed"
